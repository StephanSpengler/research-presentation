<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg" stroke="black" fill="black">
    <defs>
        <marker
            id="arrow"
            viewBox="0 0 10 10"
            refX="27"
            refY="5"
            markerWidth="5"
            markerHeight="5"
            orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" />
        </marker>
    </defs>

    <!-- Arrows -->
    <line x1="050" y1="050" x2="250" y2="050" marker-end="url(#arrow)"/>
    <line x1="250" y1="050" x2="250" y2="150" marker-end="url(#arrow)"/>
    <line x1="250" y1="150" x2="050" y2="150" marker-end="url(#arrow)"/>
    <line x1="050" y1="150" x2="050" y2="050" marker-end="url(#arrow)"/>

    <!-- Nodes -->
    <svg fill="white">
        <circle cx="050" cy="050" r="8"/>
        <circle cx="250" cy="050" r="8"/>
        <circle cx="250" cy="150" r="8"/>
        <circle cx="050" cy="150" r="8"/>
    </svg>
    <circle cx="050" cy="050" r="1"/>

    <!-- Labels -->
    <text x="150" y="040" font-size="20" text-anchor="middle">!m<tspan baseline-shift="sub" font-size="12">1</tspan></text>
    <text x="260" y="100" font-size="20" text-anchor="start">!m<tspan baseline-shift="sub" font-size="12">2</tspan></text>
    <text x="150" y="170" font-size="20" text-anchor="middle">?m<tspan baseline-shift="sub" font-size="12">1</tspan></text>
    <text x="040" y="100" font-size="20" text-anchor="end">?m<tspan baseline-shift="sub" font-size="12">2</tspan></text>
</svg>